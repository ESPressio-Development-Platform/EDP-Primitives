[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = espidf

build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17

build_flags =
    -std=gnu++20

lib_deps =
    EDP-Primitives=symlink://../../..
    EDP-System=https://github.com/ESPressio-Development-Platform/EDP-System.git#main
    EDP-Serialisation=https://github.com/ESPressio-Development-Platform/EDP-Serialisation.git#main
